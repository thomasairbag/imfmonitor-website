# Single source of truth for dataset facts shown on the site (plan Section 6).
# The shortcodes in _extensions/imfmonitor/ read this file directly and display
# it; don't load it with metadata-files (see CLAUDE.md). Change a fact here, once.
#
# Fill a field only with a verified value, and record where it came from in
# `sources`. Leave unknown fields empty: the site then shows "To be confirmed".
# Quote every text value: YAML reads a leading * or & as an alias or anchor.
#
#   id        page folder, e.g. conditionality -> /conditionality/; for an
#             entry with `page`, the anchor of its section on that page
#   name      display name
#   page      only for an entry without a page of its own: the page that
#             shows it (other-data). Links then go to that page's #id
#             section, and the Download Data table leaves the entry out.
#   tagline   one-line description for dataset cards
#   coverage  period and countries covered, as the at-a-glance panel shows it
#   period    years covered, for running text
#   counts    named numbers for running text (e.g. counts.conditions), shown
#             with {{< dataset-value counts.NAME >}}, so prose never
#             hard-codes them
#   version   release date, as month and year (e.g. "March 2026"). Every
#             dataset is versioned by release date, not by number.
#   unit      unit of observation
#   status    available | forthcoming | replication-only. A forthcoming
#             dataset with no version or files shows "Not yet released" as
#             its version and under Downloads and Version history.
#   citation  recommended citation, in Markdown (italics with *...*), worded
#             exactly as the dataset's codebook gives it
#   files     list of downloads; each has label, href (path under files/ or a
#             DOI URL), kind (codebook | data | code | archive), format, size,
#             version (its release date), and optionally description (one
#             line on what the file holds, shown under its name). Downloads lists the current
#             release, codebooks first; files of kind archive appear under
#             Version history instead, grouped by version. Current files keep
#             their plain names (IMFMonitor_...). A superseded release's files
#             take the prefix vYYYY-MM_ from its release date, e.g.
#             v2017-09_IMFMonitor_Conditionality_Raw.xlsx for September 2017;
#             the render warns if an archive label or href breaks this. Leave
#             href empty until the file is approved for publication: the list
#             then shows "To be confirmed" instead of a Download button. Sizes
#             use decimal units (1 MB = 1,000,000 bytes).
#   history   Version history, newest first: one entry per release, each with
#             version (its release date), former (the old version number, if it
#             had one), and note (what changed, in Markdown). The page shows the
#             current release's entry with a pointer to Downloads, and an earlier
#             release's entry with its archive files.
#   sources   list: which file, codebook, publication, or person each fact
#             above comes from

datasets:
  - id: conditionality
    name: "Conditionality"
    tagline: "Policy conditions attached to IMF lending programs, classified by type and policy area."
    coverage: "1980–2019; conditions in 134 countries"
    period: "1980–2019"
    counts:
      conditions: "65,894"
      countries: "134"
      panel: "220"
      policy_areas: "13"
    version: "October 2026"
    unit: "Country-year-condition (raw dataset); country-year (main dataset)"
    status: "available"
    citation: "Kentikelenis, A. & Stubbs, T. (2023). *A Thousand Cuts: Social Protection in the Age of Austerity*. Oxford University Press."
    files:
      - label: "Codebook (IMFMonitor_Conditionality_Codebook.pdf)"
        href: "files/conditionality/IMFMonitor_Conditionality_Codebook.pdf"
        kind: "codebook"
        format: "PDF"
        size: "586 KB"
        version: "October 2026"
      - label: "Main dataset (IMFMonitor_Conditionality_Main.zip)"
        href: "files/conditionality/IMFMonitor_Conditionality_Main.zip"
        description: "Country-year indicators: counts of conditions by type and policy area, and measures adjusted for waivers and program interruptions."
        kind: "data"
        format: "Stata (.dta) in ZIP"
        size: "234 KB"
        version: "October 2026"
      - label: "Raw dataset (IMFMonitor_Conditionality_Raw.xlsx)"
        href: "files/conditionality/IMFMonitor_Conditionality_Raw.xlsx"
        description: "One row per condition and year, with the condition's text, type, policy area, implementation status, and source document."
        kind: "data"
        format: "Excel (.xlsx)"
        size: "3.3 MB"
        version: "October 2026"
      - label: "Reviews dataset (IMFMonitor_Reviews.xlsx)"
        href: "files/conditionality/IMFMonitor_Reviews.xlsx"
        description: "One row per program review, with the date the Executive Board concluded it and the date proposed for the next; the code uses it to adjust conditions for program interruptions."
        kind: "data"
        format: "Excel (.xlsx)"
        size: "230 KB"
        version: "October 2026"
      - label: "Code (IMFMonitor_Conditionality_Code.zip)"
        href: "files/conditionality/IMFMonitor_Conditionality_Code.zip"
        description: "The Stata do-file that builds the main dataset from the raw dataset and the reviews dataset (IMFMonitor_Reviews.xlsx), with the World Bank income-group file it uses."
        kind: "code"
        format: "Stata do-file and World Bank income groups (.xls) in ZIP"
        size: "68 KB"
        version: "October 2026"
      - label: "Codebook (v2026-03_IMFMonitor_Conditionality_Codebook.pdf)"
        href: "files/conditionality/v2026-03_IMFMonitor_Conditionality_Codebook.pdf"
        kind: "archive"
        format: "PDF"
        size: "601 KB"
        version: "March 2026"
      - label: "Main dataset (v2026-03_IMFMonitor_Conditionality_Main.zip)"
        href: "files/conditionality/v2026-03_IMFMonitor_Conditionality_Main.zip"
        description: "Includes the 21 program participation indicators."
        kind: "archive"
        format: "Stata (.dta) in ZIP"
        size: "241 KB"
        version: "March 2026"
      - label: "Code (v2026-03_IMFMonitor_Conditionality_Code.zip)"
        href: "files/conditionality/v2026-03_IMFMonitor_Conditionality_Code.zip"
        description: "Also needs the June 2020 programs dataset, under its original name IMFMonitor_Programs.xlsx; the Programs page's version history has it as v2020-06_IMFMonitor_Programs.xlsx."
        kind: "archive"
        format: "Stata do-file and World Bank income groups (.xls) in ZIP"
        size: "69 KB"
        version: "March 2026"
      - label: "Codebook (v2017-09_IMFMonitor_Conditionality_Codebook.pdf)"
        href: "files/conditionality/v2017-09_IMFMonitor_Conditionality_Codebook.pdf"
        kind: "archive"
        format: "PDF"
        size: "2.0 MB"
        version: "September 2017"
      - label: "Main dataset (v2017-09_IMFMonitor_Conditionality_Main.zip)"
        href: "files/conditionality/v2017-09_IMFMonitor_Conditionality_Main.zip"
        kind: "archive"
        format: "Stata (.dta) in ZIP"
        size: "208 KB"
        version: "September 2017"
      - label: "Raw dataset (v2017-09_IMFMonitor_Conditionality_Raw.xlsx)"
        href: "files/conditionality/v2017-09_IMFMonitor_Conditionality_Raw.xlsx"
        kind: "archive"
        format: "Excel (.xlsx)"
        size: "4.1 MB"
        version: "September 2017"
    history:
      - version: "October 2026"
        note: "Removes the 21 program participation indicators added in March 2026: program participation is now recorded in the [Programs](../programs/index.qmd) dataset. The data are otherwise unchanged, and the main and raw datasets are identical to those of July 2023. The codebook drops its sections on program participation and the programs dataset, and the code no longer needs the programs file."
      - version: "March 2026"
        former: "v2.1"
        note: "Adds 21 indicators of IMF program participation to the main dataset: the number of months a program was in force in each year, and several yes-or-no measures of whether one was in force, each for all, concessional, and non-concessional programs. The codebook gains sections on these indicators and on the programs dataset, and a note on grouping the policy areas into broader categories. All other variables, and the raw dataset, are unchanged from July 2023."
      - version: "July 2023"
        former: "v2.0"
        note: "Extends coverage from 1980–2014 to 1980–2019, and from 216 to 220 countries and territories, with 65,894 conditions in all. It also revises the coding of some conditions from 1980–2014: for example, structural performance criteria in 2009 are no longer recoded as structural benchmarks, and conditions from previously embargoed documents are added. The codebook's section on dataset updates lists each change. This release's files are not offered separately: its main and raw datasets are identical to those of October 2026."
      - version: "September 2017"
        former: "v1.0"
        note: "First release, covering 1980–2014 for 216 countries and territories, with 58,406 conditions in the main dataset. Its codebook asks users to cite Kentikelenis, Stubbs, and King (2016)."
    sources:
      - "Files, October 2026: the release Thomas Stubbs approved on 20 October 2026 (archived in his Dropbox, IMFMonitor/TO_SORT). The codebook is the March 2026 codebook less its program participation content, with a version line (29 pages, 585,768 bytes). The main dataset was rebuilt in Stata 17 by the new do-file and matches the July 2023 main dataset exactly. The raw and reviews datasets are the March 2026 files, unchanged. Sizes are the files' byte counts."
      - "Files, March 2026 and September 2017: the public download on imfmonitor.org (the Wix file share, backed up 15 October 2026; byte-identical to the project's v2.1 and v1.0 folders). The March 2026 codebook PDF was exported with Word from IMFMonitor_Conditionality_Codebook.docx (32 pages, 600,691 bytes)."
      - "coverage: IMFMonitor_Conditionality_Main.dta (years 1980–2019; 220 country codes, 8,800 country-years) and IMFMonitor_Conditionality_Raw.xlsx (conditions for 134 country codes); codebook title 'IMF Conditionality Dataset, 1980-2019'."
      - "version: Thomas Stubbs, 20 October 2026 (versions are release dates; a new release without the program indicators, dated October 2026, the month its files were made). The codebook and do-file read 'Version: October 2026'. The raw and reviews files' notes sheets still read 'Version: June 2020'."
      - "unit: codebook, 'Variable List for the Raw Dataset' (country-year-condition) and 'Transforming the Data' (country-year indicators in the main dataset)."
      - "IMFMonitor_Reviews.xlsx is part of the Conditionality download because the code needs it (Thomas Stubbs, 20 October 2026); the public copy, byte-identical to the Wix download. Description: the codebook's reviews variable list (Review Date, Review Next Date) and Step 4 (interruptions); the do-file imports it to build the interruption-discounted indicators."
      - "status: publicly downloadable from imfmonitor.org/download-data (checked 20 October 2026)."
      - "File descriptions: codebook, 'Variable List for the Raw Dataset' and 'Transforming the Data'. The October 2026 do-file imports IMFMonitor_Conditionality_Raw.xlsx, IMFMonitor_Reviews.xlsx, and Merge/WBINCOME_static.xls and saves IMFMonitor_Conditionality_Main.dta; the March 2026 do-file also imports IMFMonitor_Programs.xlsx."
      - "history, October 2026: Thomas Stubbs, 20 October 2026 (option B: take the program indicators out as a new release). The rebuilt main dataset has the same 8,800 rows and 237 variables, in the same order and with the same labels and values, as the July 2023 main dataset; the do-file ran in Stata 17 without errors and without the programs file."
      - "citation: codebook, 'Citation' section, worded and italicised as given there (Thomas Stubbs, 20 October 2026: use the codebook wording)."
      - "period and counts: BA1TOT in IMFMonitor_Conditionality_Main.dta sums to 65,894 (conditions), all of them in the 134 countries with a non-zero total; the raw dataset has the same 134 country codes (countries); the main dataset has 220 country codes, which include territories such as American Samoa and Puerto Rico (panel); the codebook classifies conditions into 13 mutually exclusive policy areas (policy_areas)."
      - "Archive files: v1.0 codebook title page ('Version: September 2017', 'IMF Conditionality 1980–2014'). Published under the release-date prefix v2017-09_ (Thomas Stubbs, 20 October 2026); imfmonitor.org offered them as v1.0_IMFMonitor_Conditionality_*. Contents unchanged."
      - "history, March 2026: the main dataset gains 21 variables (IMFm, IMFnn, IMF6n, IMF33, IMF44, IMF55, IMF66, and the con- and non- versions of each) and loses none; every common variable has identical values in the v2.0 and v2.1 main datasets, and the raw datasets are byte-identical (checked 20 October 2026). The 2026 codebook adds 'Program Participation Indicators' and 'Variable List for the Programs Dataset', which the July 2023 codebook PDF lacks. It also adds a note grouping the 13 policy areas into broader categories used in A Thousand Cuts."
      - "history, July 2023: dated by its codebook PDF (created 22 July 2023, just after A Thousand Cuts), as Thomas Stubbs asked on 20 October 2026; the data files' own notes sheets say 'Version: June 2020', and the release may have been public then; the v2.0 main dataset (1980–2019, 220 country codes, BA1TOT 65,894); the codebook's 'Dataset Updates and Discrepancies' section."
      - "history, September 2017: the v1.0 codebook ('Version: September 2017'; 'How to cite the dataset': Kentikelenis, Stubbs, and King 2016); the v1.0 main dataset (INETDataset_Main.dta: 1980–2014, 216 country codes, BA1TOT 58,406)."
      - "tagline: the codebook (conditions classified by type and into 13 policy areas), as in the page summary. Thomas Stubbs approved the wording on 22 October 2026."

  - id: programs
    name: "Programs"
    tagline: "Participation in IMF lending arrangements, by arrangement and as a yearly country panel."
    coverage: "1952–2025; 202 independent states"
    period: "1952–2025"
    counts:
      arrangements: "1,693"
      members: "162"
      added: "102"
      panel_arrangements: "1,428"
      states: "202"
    version: "October 2026"
    unit: "Arrangement or outright purchase (raw dataset); country-year (panel dataset)"
    status: "available"
    citation: "Stubbs, T. (2026). *IMF Programs Dataset, 1952–2025* (Version: October 2026). IMF Monitor. <https://doi.org/10.7910/DVN/V4V1BA>"
    files:
      - label: "Codebook (IMFMonitor_Programs_Codebook.pdf)"
        href: "files/programs/IMFMonitor_Programs_Codebook.pdf"
        kind: "codebook"
        format: "PDF"
        size: "414 KB"
        version: "October 2026"
      - label: "Raw dataset (IMFMonitor_Programs_Raw.xlsx)"
        href: "files/programs/IMFMonitor_Programs_Raw.xlsx"
        description: "One row per arrangement or outright purchase, with the IMF member, facility, approval and expiration dates, and amounts agreed, drawn, and outstanding, from IMF data as of 30 September 2026. A note on each row added from other IMF sources gives its evidence. Further sheets list the members queried and log the download."
        kind: "data"
        format: "Excel (.xlsx)"
        size: "117 KB"
        version: "October 2026"
      - label: "Panel dataset (IMFMonitor_Programs_Panel.xlsx)"
        href: "files/programs/IMFMonitor_Programs_Panel.xlsx"
        description: "One row per independent state per year, whether an IMF member or not: the months under an IMF program, and whether a program was in force at all or for at least three, four, five, or six months, for all, concessional, and non-concessional programs. Rapid disbursements and outright purchases are left out. Further sheets document the country list, state dates, facility groups, and checks."
        kind: "data"
        format: "Excel (.xlsx)"
        size: "912 KB"
        version: "October 2026"
      - label: "Scraper script (IMFMonitor_Programs_Code_00_Webscraper.R)"
        href: "files/programs/IMFMonitor_Programs_Code_00_Webscraper.R"
        description: "Downloads each member's arrangements from the IMF's History of Lending Commitments page, adds the arrangements and purchases the page does not show, and writes the raw dataset. It is provided for transparency: it takes the latest data the IMF offers, so a run today gives an updated dataset that may differ from this release, which used IMF data as of 30 September 2026."
        kind: "code"
        format: "R script"
        size: "70 KB"
        version: "October 2026"
      - label: "Panel build script (IMFMonitor_Programs_Code_01_BuildPanel.R)"
        href: "files/programs/IMFMonitor_Programs_Code_01_BuildPanel.R"
        description: "Builds the panel dataset from the raw dataset, using state dates set out in the script and the World Bank's country list, which it downloads when run."
        kind: "code"
        format: "R script"
        size: "81 KB"
        version: "October 2026"
      - label: "Programs dataset (v2020-06_IMFMonitor_Programs.xlsx)"
        href: "files/programs/v2020-06_IMFMonitor_Programs.xlsx"
        description: "One row per arrangement, with its type, approval date, duration, amount, augmentations, expiration date, and source documents. The March 2026 Conditionality code reads it under its original name, IMFMonitor_Programs.xlsx."
        kind: "archive"
        format: "Excel (.xlsx)"
        size: "150 KB"
        version: "June 2020"
    history:
      - version: "October 2026"
        note: "Replaces the hand-coded June 2020 file with a dataset built by two R scripts from the IMF's History of Lending Commitments page, with 102 arrangements and outright purchases that the page does not show added from other IMF sources. Coverage extends from 1980–2019 to 1952–2025, and a new panel dataset gives yearly program participation indicators for every independent state. The dataset has its own codebook. The indicators have the same names as the 21 in the March 2026 [Conditionality](../conditionality/index.qmd) release, but are built from the new data and count months differently: a program in force from March to September of one year now counts as seven months, not six."
      - version: "June 2020"
        note: "Coded by hand from IMF documents: 1,284 arrangements in 144 countries, approved from April 1978 to December 2019. It was offered with the March 2026 Conditionality release, whose codebook lists its variables."
    sources:
      - "Files: Thomas Stubbs, 19 October 2026 (the raw and panel datasets, the codebook as a PDF, and the two build scripts; the June 2020 file stays in the version history). Sizes are the files' byte counts, checked 20 October 2026. The codebook PDF was exported from IMFMonitor_Programs_Codebook.docx with Word on 20 October 2026 (14 pages, 413,689 bytes)."
      - "coverage: Programs codebook, Step 3 and Section 3 (panel of 202 independent states, 1952–2025, 12,155 country-years), matching the Country_Year sheet of IMFMonitor_Programs_Panel.xlsx."
      - "version: Programs codebook ('Version: October 2026'); the files were built on 7 and 9 October 2026 from IMF data as of 30 September 2026 (Run_Metadata and Summary sheets)."
      - "unit: Programs codebook, Sections 2 and 3 (raw: one row per arrangement or outright purchase per IMF member, 1,693 rows; panel: one row per independent state per year)."
      - "status: Thomas Stubbs, 20 October 2026."
      - "citation: Programs codebook, 'How to cite this dataset', worded and italicised as given there. The DOI is Harvard Dataverse doi:10.7910/DVN/V4V1BA, deposited by Thomas Stubbs on 11 October 2026 and published on 13 October 2026 in the IMF Monitor collection; its five files are byte-identical to this release (checked 20 October 2026). Thomas Stubbs, 20 October 2026: use it."
      - "June 2020 file: notes sheet ('IMF Programs Dataset, 1980-2019', 'Version: June 2020'); byte-identical to IMFMonitor_Programs.xlsx in the Conditionality download on imfmonitor.org, published here as v2020-06_IMFMonitor_Programs.xlsx (Thomas Stubbs, 20 October 2026). Contents unchanged."
      - "period and counts: Programs codebook, Sections 1–3, checked against the files on 21 October 2026. The Arrangements sheet of IMFMonitor_Programs_Raw.xlsx has 1,693 rows (arrangements) for 162 IMF members (members), 102 of them with source 'Manual addition' (added). Leaving out the five excluded facilities and approvals after 31 December 2025 leaves 1,428 (panel_arrangements; the panel workbook's Summary sheet agrees). The Country_Year sheet of IMFMonitor_Programs_Panel.xlsx has 202 country codes (states) and years 1952–2025 (period)."
      - "File descriptions: codebook, Sections 1–3; the workbooks' sheets (raw: Arrangements, Members, Run_Metadata, Errors, Query_Log; panel: Country_Year and twelve sheets on countries, states, facilities, and checks); the scripts' headers and settings (the scraper queries the latest as-of date on the IMF page, so a rerun may differ from this release; Thomas Stubbs approved the wording on 21 October 2026; the panel script holds the state dates in STATE_EXISTENCE and reads the World Bank country API at run time). June 2020 file: its Dataset sheet's columns."
      - "history, October 2026: Programs codebook, Steps 1–4, and its source_note abbreviations ('IMFMonitor_Programs = the earlier hand-coded dataset'). Indicator names: the 21 variables added to the March 2026 Conditionality main dataset (IMFm, IMFnn, IMF6n, IMF33, IMF44, IMF55, IMF66, and the con- and non- versions) match the panel's. Months: the March 2026 Conditionality do-file counts a same-year spell as end month minus start month; the panel script's default 'calendar' method counts each month in force (its 'legacy' option reproduces the old arithmetic), and the codebook's IMFm definition gives March to September as 7."
      - "history, June 2020: v2020-06_IMFMonitor_Programs.xlsx (Dataset sheet: 1,284 rows, 144 country codes, arrangement dates 26 April 1978 to 20 December 2019). It was in the March 2026 Conditionality download on imfmonitor.org (the Wix file share, dated 27 March 2026); it is not in the July 2023 (v2.0) folder. The March 2026 Conditionality codebook has a 'Variable List for the Programs Dataset'."
      - "tagline: Programs codebook, Sections 2 and 3 (raw dataset: one row per arrangement or outright purchase; panel dataset: one row per independent state per year). Thomas Stubbs approved the wording on 22 October 2026."

  - id: governance
    name: "Governance"
    tagline: "IMF Executive Board discussions of individual countries, with the full text of each comment."
    coverage: "1995–2015; 142 countries"
    period: "1995–2015"
    counts:
      meetings: "3,111"
      countries: "142"
      words: "38 million"
    version: "January 2025"
    unit: "Meeting (meeting-level data) and speech (speech-level data)"
    status: "available"
    citation: "Forster, T., Honig, D. & Kentikelenis, A. (2025). Formal governance matters: when, how, and why states act on the IMF Executive Board. *Review of International Political Economy*. <https://dx.doi.org/10.1080/09692290.2024.2441136>"
    files:
      - label: "Codebook (IMFMonitor_ExecutiveBoardMinutes_Codebook.pdf)"
        href: "files/governance/IMFMonitor_ExecutiveBoardMinutes_Codebook.pdf"
        kind: "codebook"
        format: "PDF"
        size: "285 KB"
        version: "January 2025"
      - label: "Text corpus (IMFMonitor_ExecutiveBoardMinutes.zip)"
        href: "files/governance/IMFMonitor_ExecutiveBoardMinutes.zip"
        description: "The speech-level data, as IMFMonitor_ExecutiveBoardMinutes.rds (the codebook's IMFEBM_Speeches_Nov2024_V1.rds): one row per speech, or per attendee who did not speak, with the full text, the speaker's name, position, country, and constituency, and the meeting's identifier and date."
        kind: "data"
        format: "R data (.rds) in ZIP"
        size: "93.6 MB"
        version: "January 2025"
      - label: "Meeting-level data (IMFMonitor_ExecutiveBoardMeetings.rds)"
        href: "files/governance/IMFMonitor_ExecutiveBoardMeetings.rds"
        description: "The codebook's IMFEBM_Meeting_Nov2024_V1.rds: one row per meeting, with its date, minutes number, topic, and the country under discussion, with its constituency and whether it is an emerging, low-income, or small economy. It also lists the meetings held in restricted session or without discussion, which have no text. Links to the speech-level data through meeting_id."
        kind: "data"
        format: "R data (.rds)"
        size: "92 KB"
        version: "January 2025"
    history:
      - version: "January 2025"
        note: "The codebook and the meeting- and speech-level data were published on Harvard Dataverse in January 2025, with the replication data for Forster, Honig, and Kentikelenis (2025). imfmonitor.org offered the codebook and speech-level data from May 2025."
    sources:
      - "Files: the public download on imfmonitor.org (the Wix file share's 'IMF Executive Board Minutes Dataset' folder, backed up 15 October 2026; byte-identical to the project's Board minutes folder). Hosted on the site like the other datasets' files, not linked to Dataverse (Thomas Stubbs, 20 October 2026). Sizes are the files' byte counts."
      - "The zip holds IMFMonitor_ExecutiveBoardMinutes.rds, the speech-level file. It and the codebook are byte-identical to IMFEBM_Speeches_Nov2024_V1.rds and Codebook_IMFEBM_November24.pdf on Harvard Dataverse doi:10.7910/DVN/7N7LCH ('Replication Data for: Formal governance matters', in the Harvard Dataverse collection, not the IMF Monitor collection), checked by MD5 on 20 October 2026."
      - "Meeting-level file: IMFEBM_Meeting_Nov2024_V1.rds, downloaded from Harvard Dataverse doi:10.7910/DVN/7N7LCH on 21 October 2026 with Thomas Stubbs's approval (decision 12). It is published as IMFMonitor_ExecutiveBoardMeetings.rds, the name Thomas Stubbs chose on 21 October 2026; the codebook uses the Dataverse name. Its MD5 (81344199ecb8c6684527e70abe258b4b) and size (91,564 bytes) match the record's. Contents unchanged. It has 3,177 rows and the codebook's 23 meeting-level variables: 3,111 meetings with discussion and transcripts, 23 in restricted session, and 43 without discussion (codebook, p. 5). Every meeting_id in the speech-level file appears in it."
      - "coverage: codebook, pp. 1 and 5 (1995–2015; 'All 142 countries included in our sample'); the speech-level file has 142 country codes in meeting_id and discussion dates from 11 January 1995 to 14 December 2015."
      - "version: first public release of these files, on Harvard Dataverse on 17 January 2025; the same files went up on imfmonitor.org on 2 May 2025."
      - "unit: codebook, p. 5 (Component 1, meeting-level data; Component 2, speech-level data)."
      - "status: publicly downloadable from imfmonitor.org/download-data and Harvard Dataverse (checked 20 October 2026)."
      - "citation: codebook, 'Citation' section, worded and italicised as given there (Thomas Stubbs, 20 October 2026: use the codebook wording)."
      - "period and counts: the speech-level file, checked 21 October 2026: 3,111 distinct meeting_id values (meetings), as the codebook states (pp. 1, 2, and 5); 142 country prefixes in meeting_id (countries), as the codebook states on p. 5 (p. 7 says 141); discussion dates from 11 January 1995 to 14 December 2015 (period). The codebook gives 'more than 38 million words' (p. 1): the non-duplicate speeches of state representatives (sp_position ED, AED, TAED, SeniorAdvisor, Advisor, or Assistant; c_dupl 0) have 38,510,299 words by stringi's word count (words). 'Low- and middle-income countries' and 'primarily on the topics of lending and economic surveillance': codebook, pp. 1 and 7."
      - "File descriptions: codebook, p. 5 (Component 1, meeting-level data) and pp. 5–6 (Component 2, speech-level data: 164,263 observations, including attendees who did not speak). The speech-level file's 15 variables are the codebook's speech-level variables."
      - "history, January 2025: Harvard Dataverse doi:10.7910/DVN/7N7LCH (versions 1.0 and 1.1 both released 17 January 2025), which holds the same codebook and meeting- and speech-level files (MD5, 20 and 21 October 2026); the Wix file share's 'IMF Executive Board Minutes Dataset' folder, dated 2 May 2025, which held the codebook and speech-level file."
      - "tagline: codebook, pp. 1 and 5 (country-specific Executive Board discussions; the speech-level data give the full text of each speech), as in the page summary. Thomas Stubbs approved the wording on 22 October 2026."

