# Single source of truth for dataset facts shown on the site (plan Section 6).
# The shortcodes in _extensions/imfmonitor/ read this file directly and display
# it; don't load it with metadata-files (see CLAUDE.md). Change a fact here, once.
#
# Fill a field only with a verified value, and record where it came from in
# `sources`. Leave unknown fields empty: the site then shows "To be confirmed".
# Quote every text value: YAML reads a leading * or & as an alias or anchor.
#
#   id        page folder, e.g. conditionality -> /conditionality/
#   name      display name
#   tagline   one-line description for dataset cards
#   coverage  period and countries covered, as the at-a-glance panel shows it
#   period    years covered, for running text
#   counts    named numbers for running text (e.g. counts.conditions), shown
#             with {{< dataset-value counts.NAME >}}, so prose never
#             hard-codes them
#   version   release date, as month and year (e.g. "March 2026"). Every
#             dataset is versioned by release date, not by number.
#   unit      unit of observation
#   status    available | forthcoming | replication-only
#   citation  recommended citation, in Markdown (italics with *...*), worded
#             exactly as the dataset's codebook gives it
#   files     list of downloads; each has label, href (path under files/ or a
#             DOI URL), kind (codebook | data | code | archive), format, size,
#             version (its release date), and optionally description (one
#             line on what the file holds, shown under its name). Downloads lists the current
#             release, codebooks first; files of kind archive appear under
#             Version history instead, grouped by version. Current files keep
#             their plain names (IMFMonitor_...). A superseded release's files
#             take the prefix vYYYY-MM_ from its release date, e.g.
#             v2017-09_IMFMonitor_Conditionality_Raw.xlsx for September 2017;
#             the render warns if an archive label or href breaks this. Leave
#             href empty until the file is approved for publication: the list
#             then shows "To be confirmed" instead of a Download button. Sizes
#             use decimal units (1 MB = 1,000,000 bytes).
#   history   Version history, newest first: one entry per release, each with
#             version (its release date), former (the old version number, if it
#             had one), and note (what changed, in Markdown). The page shows the
#             current release's entry with a pointer to Downloads, and an earlier
#             release's entry with its archive files.
#   sources   list: which file, codebook, publication, or person each fact
#             above comes from

datasets:
  - id: conditionality
    name: "Conditionality"
    tagline:
    coverage: "1980–2019; conditions in 134 countries"
    period: "1980–2019"
    counts:
      conditions: "65,894"
      countries: "134"
      panel: "220"
      policy_areas: "13"
    version: "October 2026"
    unit: "Country-year-condition (raw dataset); country-year (main dataset)"
    status: "available"
    citation: "Kentikelenis, A. & Stubbs, T. (2023). *A Thousand Cuts: Social Protection in the Age of Austerity*. Oxford University Press."
    files:
      - label: "Codebook (IMFMonitor_Conditionality_Codebook.pdf)"
        href: "files/conditionality/IMFMonitor_Conditionality_Codebook.pdf"
        kind: "codebook"
        format: "PDF"
        size: "586 KB"
        version: "October 2026"
      - label: "Main dataset (IMFMonitor_Conditionality_Main.zip)"
        href: "files/conditionality/IMFMonitor_Conditionality_Main.zip"
        description: "Country-year indicators: counts of conditions by type and policy area, and measures adjusted for waivers and program interruptions."
        kind: "data"
        format: "Stata (.dta) in ZIP"
        size: "234 KB"
        version: "October 2026"
      - label: "Raw dataset (IMFMonitor_Conditionality_Raw.xlsx)"
        href: "files/conditionality/IMFMonitor_Conditionality_Raw.xlsx"
        description: "One row per condition and year, with the condition's text, type, policy area, implementation status, and source document."
        kind: "data"
        format: "Excel (.xlsx)"
        size: "3.3 MB"
        version: "October 2026"
      - label: "Reviews dataset (IMFMonitor_Reviews.xlsx)"
        href: "files/conditionality/IMFMonitor_Reviews.xlsx"
        description: "One row per program review, with the date the Executive Board concluded it and the date proposed for the next; the code uses it to adjust conditions for program interruptions."
        kind: "data"
        format: "Excel (.xlsx)"
        size: "230 KB"
        version: "October 2026"
      - label: "Code (IMFMonitor_Conditionality_Code.zip)"
        href: "files/conditionality/IMFMonitor_Conditionality_Code.zip"
        description: "The Stata do-file that builds the main dataset from the raw dataset and the reviews dataset (IMFMonitor_Reviews.xlsx), with the World Bank income-group file it uses."
        kind: "code"
        format: "Stata do-file and World Bank income groups (.xls) in ZIP"
        size: "68 KB"
        version: "October 2026"
      - label: "Codebook (v2026-03_IMFMonitor_Conditionality_Codebook.pdf)"
        href: "files/conditionality/v2026-03_IMFMonitor_Conditionality_Codebook.pdf"
        kind: "archive"
        format: "PDF"
        size: "601 KB"
        version: "March 2026"
      - label: "Main dataset (v2026-03_IMFMonitor_Conditionality_Main.zip)"
        href: "files/conditionality/v2026-03_IMFMonitor_Conditionality_Main.zip"
        description: "Includes the 21 program participation indicators."
        kind: "archive"
        format: "Stata (.dta) in ZIP"
        size: "241 KB"
        version: "March 2026"
      - label: "Code (v2026-03_IMFMonitor_Conditionality_Code.zip)"
        href: "files/conditionality/v2026-03_IMFMonitor_Conditionality_Code.zip"
        description: "Also needs the June 2020 programs dataset, under its original name IMFMonitor_Programs.xlsx; the Programs page's version history has it as v2020-06_IMFMonitor_Programs.xlsx."
        kind: "archive"
        format: "Stata do-file and World Bank income groups (.xls) in ZIP"
        size: "69 KB"
        version: "March 2026"
      - label: "Codebook (v2017-09_IMFMonitor_Conditionality_Codebook.pdf)"
        href: "files/conditionality/v2017-09_IMFMonitor_Conditionality_Codebook.pdf"
        kind: "archive"
        format: "PDF"
        size: "2.0 MB"
        version: "September 2017"
      - label: "Main dataset (v2017-09_IMFMonitor_Conditionality_Main.zip)"
        href: "files/conditionality/v2017-09_IMFMonitor_Conditionality_Main.zip"
        kind: "archive"
        format: "Stata (.dta) in ZIP"
        size: "208 KB"
        version: "September 2017"
      - label: "Raw dataset (v2017-09_IMFMonitor_Conditionality_Raw.xlsx)"
        href: "files/conditionality/v2017-09_IMFMonitor_Conditionality_Raw.xlsx"
        kind: "archive"
        format: "Excel (.xlsx)"
        size: "4.1 MB"
        version: "September 2017"
    history:
      - version: "October 2026"
        note: "Removes the 21 program participation indicators added in March 2026: program participation is now recorded in the [Programs](../programs/index.qmd) dataset. The data are otherwise unchanged, and the main and raw datasets are identical to those of July 2023. The codebook drops its sections on program participation and the programs dataset, and the code no longer needs the programs file."
      - version: "March 2026"
        former: "v2.1"
        note: "Adds 21 indicators of IMF program participation to the main dataset: the number of months a program was in force in each year, and several yes-or-no measures of whether one was in force, each for all, concessional, and non-concessional programs. The codebook gains sections on these indicators and on the programs dataset, and a note on grouping the policy areas into broader categories. All other variables, and the raw dataset, are unchanged from July 2023."
      - version: "July 2023"
        former: "v2.0"
        note: "Extends coverage from 1980–2014 to 1980–2019, and from 216 to 220 countries and territories, with 65,894 conditions in all. It also revises the coding of some conditions from 1980–2014: for example, structural performance criteria in 2009 are no longer recoded as structural benchmarks, and conditions from previously embargoed documents are added. The codebook's section on dataset updates lists each change. This release's files are not offered separately: its main and raw datasets are identical to those of October 2026."
      - version: "September 2017"
        former: "v1.0"
        note: "First release, covering 1980–2014 for 216 countries and territories, with 58,406 conditions in the main dataset. Its codebook asks users to cite Kentikelenis, Stubbs, and King (2016)."
    sources:
      - "Files, October 2026: the release Thomas Stubbs approved on 20 October 2026 (archived in his Dropbox, IMFMonitor/TO_SORT). The codebook is the March 2026 codebook less its program participation content, with a version line (29 pages, 585,768 bytes). The main dataset was rebuilt in Stata 17 by the new do-file and matches the July 2023 main dataset exactly. The raw and reviews datasets are the March 2026 files, unchanged. Sizes are the files' byte counts."
      - "Files, March 2026 and September 2017: the public download on imfmonitor.org (the Wix file share, backed up 15 October 2026; byte-identical to the project's v2.1 and v1.0 folders). The March 2026 codebook PDF was exported with Word from IMFMonitor_Conditionality_Codebook.docx (32 pages, 600,691 bytes)."
      - "coverage: IMFMonitor_Conditionality_Main.dta (years 1980–2019; 220 country codes, 8,800 country-years) and IMFMonitor_Conditionality_Raw.xlsx (conditions for 134 country codes); codebook title 'IMF Conditionality Dataset, 1980-2019'."
      - "version: Thomas Stubbs, 20 October 2026 (versions are release dates; a new release without the program indicators, dated October 2026, the month its files were made). The codebook and do-file read 'Version: October 2026'. The raw and reviews files' notes sheets still read 'Version: June 2020'."
      - "unit: codebook, 'Variable List for the Raw Dataset' (country-year-condition) and 'Transforming the Data' (country-year indicators in the main dataset)."
      - "IMFMonitor_Reviews.xlsx is part of the Conditionality download because the code needs it (Thomas Stubbs, 20 October 2026); the public copy, byte-identical to the Wix download. Description: the codebook's reviews variable list (Review Date, Review Next Date) and Step 4 (interruptions); the do-file imports it to build the interruption-discounted indicators."
      - "status: publicly downloadable from imfmonitor.org/download-data (checked 20 October 2026)."
      - "File descriptions: codebook, 'Variable List for the Raw Dataset' and 'Transforming the Data'. The October 2026 do-file imports IMFMonitor_Conditionality_Raw.xlsx, IMFMonitor_Reviews.xlsx, and Merge/WBINCOME_static.xls and saves IMFMonitor_Conditionality_Main.dta; the March 2026 do-file also imports IMFMonitor_Programs.xlsx."
      - "history, October 2026: Thomas Stubbs, 20 October 2026 (option B: take the program indicators out as a new release). The rebuilt main dataset has the same 8,800 rows and 237 variables, in the same order and with the same labels and values, as the July 2023 main dataset; the do-file ran in Stata 17 without errors and without the programs file."
      - "citation: codebook, 'Citation' section, worded and italicised as given there (Thomas Stubbs, 20 October 2026: use the codebook wording)."
      - "period and counts: BA1TOT in IMFMonitor_Conditionality_Main.dta sums to 65,894 (conditions), all of them in the 134 countries with a non-zero total; the raw dataset has the same 134 country codes (countries); the main dataset has 220 country codes, which include territories such as American Samoa and Puerto Rico (panel); the codebook classifies conditions into 13 mutually exclusive policy areas (policy_areas)."
      - "Archive files: v1.0 codebook title page ('Version: September 2017', 'IMF Conditionality 1980–2014'). Published under the release-date prefix v2017-09_ (Thomas Stubbs, 20 October 2026); imfmonitor.org offered them as v1.0_IMFMonitor_Conditionality_*. Contents unchanged."
      - "history, March 2026: the main dataset gains 21 variables (IMFm, IMFnn, IMF6n, IMF33, IMF44, IMF55, IMF66, and the con- and non- versions of each) and loses none; every common variable has identical values in the v2.0 and v2.1 main datasets, and the raw datasets are byte-identical (checked 20 October 2026). The 2026 codebook adds 'Program Participation Indicators' and 'Variable List for the Programs Dataset', which the July 2023 codebook PDF lacks. It also adds a note grouping the 13 policy areas into broader categories used in A Thousand Cuts."
      - "history, July 2023: dated by its codebook PDF (created 22 July 2023, just after A Thousand Cuts), as Thomas Stubbs asked on 20 October 2026; the data files' own notes sheets say 'Version: June 2020', and the release may have been public then; the v2.0 main dataset (1980–2019, 220 country codes, BA1TOT 65,894); the codebook's 'Dataset Updates and Discrepancies' section."
      - "history, September 2017: the v1.0 codebook ('Version: September 2017'; 'How to cite the dataset': Kentikelenis, Stubbs, and King 2016); the v1.0 main dataset (INETDataset_Main.dta: 1980–2014, 216 country codes, BA1TOT 58,406)."

