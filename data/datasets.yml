        size: "230 KB"
    sources:
      - "File: IMFMonitor_Reviews.xlsx, the copy in the Conditionality download (Thomas Stubbs, 20 October 2026: the Conditionality code needs it, and Other Data may list it too). One file, listed on both pages. Size: 230,263 bytes."
      - "coverage and period: the file's Notes sheet ('IMF Reviews Dataset, 1980-2015'). Its Board dates run from 26 April 1978 to 29 July 2015; Thomas Stubbs, 21 October 2026: arrangements approved in 1978 and 1979 are included only because they ran into 1980, so the file does not hold every review of those years. The Conditionality codebook (Step 4) says 'between the years 1978 and 2015'."
      - "counts: the Dataset sheet, checked 21 October 2026. It has 2,631 rows (decision 11: the codebook's 2,632 counts the sheet's header row as well). By the codebook's rule ('Review Number': the approval meeting is coded 0), 762 rows are approvals (programs) and 1,869 are reviews; arrangements approved together in one Board document are one row ('Arrangement Parallel'). Kosovo's April 2012 Stand-By Arrangement (EBM/12/40) is coded under the arrangement fields of its July 2010 one, so the file has 761 distinct arrangement identifiers. 133 country codes (countries)."
      - "status: publicly downloadable as part of the Conditionality release (see that record)."
      - "citation: the file's Notes sheet ('When using the data, please cite …'), as worded there, with the title italicised as in the Conditionality codebook."
      - "Text on the Other Data page: the Conditionality codebook, Step 4 ('Extracting the Review Dates') and 'Variable List for the Reviews Dataset'; the October 2026 Conditionality do-file imports the file."

