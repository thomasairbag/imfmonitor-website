# Single source of truth for dataset facts shown on the site (plan Section 6).
# The shortcodes in _extensions/imfmonitor/ read this file directly and display
# it; don't load it with metadata-files (see CLAUDE.md). Change a fact here, once.
#
# Fill a field only with a verified value, and record where it came from in
# `sources`. Leave unknown fields empty: the site then shows "To be confirmed".
# Quote every text value: YAML reads a leading * or & as an alias or anchor.
#
#   id        page folder, e.g. conditionality -> /conditionality/
#   name      display name
#   tagline   one-line description for dataset cards
#   coverage  period and countries covered
#   version   release date, as month and year (e.g. "March 2026"). Every
#             dataset is versioned by release date, not by number.
#   unit      unit of observation
#   status    available | forthcoming | replication-only
#   citation  recommended citation, in Markdown (italics with *...*), worded
#             exactly as the dataset's codebook gives it
#   files     list of downloads; each has label, href (path under files/ or a
#             DOI URL), kind (codebook | data | code | archive), format, size,
#             and version (its release date). Downloads lists the current
#             release, codebooks first; files of kind archive appear under
#             Version history instead, grouped by version. Current files keep
#             their plain names (IMFMonitor_...). A superseded release's files
#             take the prefix vYYYY-MM_ from its release date, e.g.
#             v2017-09_IMFMonitor_Conditionality_Raw.xlsx for September 2017;
#             the render warns if an archive label or href breaks this. Leave href empty
#             until the file is approved for publication: the list then shows
#             "To be confirmed" instead of a Download button. Sizes use
#             decimal units (1 MB = 1,000,000 bytes).
#   sources   list: which file, codebook, publication, or person each fact
#             above comes from

datasets:
  - id: conditionality
    name: "Conditionality"
    tagline:
    coverage: "1980–2019; conditions in 134 countries"
    version: "March 2026"
    unit: "Country-year-condition (raw dataset); country-year (main dataset)"
    status: "available"
    citation: "Kentikelenis, A. & Stubbs, T. (2023). *A Thousand Cuts: Social Protection in the Age of Austerity*. Oxford University Press."
    files:
      - label: "Codebook (IMFMonitor_Conditionality_Codebook.pdf)"
        href: "files/conditionality/IMFMonitor_Conditionality_Codebook.pdf"
        kind: "codebook"
        format: "PDF"
        size: "601 KB"
        version: "March 2026"
      - label: "Main dataset (IMFMonitor_Conditionality_Main.zip)"
        href: "files/conditionality/IMFMonitor_Conditionality_Main.zip"
        kind: "data"
        format: "Stata (.dta) in ZIP"
        size: "241 KB"
        version: "March 2026"
      - label: "Raw dataset (IMFMonitor_Conditionality_Raw.xlsx)"
        href: "files/conditionality/IMFMonitor_Conditionality_Raw.xlsx"
        kind: "data"
        format: "Excel (.xlsx)"
        size: "3.3 MB"
        version: "March 2026"
      - label: "Code (IMFMonitor_Conditionality_Code.zip)"
        href: "files/conditionality/IMFMonitor_Conditionality_Code.zip"
        kind: "code"
        format: "Stata do-file and World Bank income groups (.xls) in ZIP"
        size: "69 KB"
        version: "March 2026"
      - label: "Codebook (v2017-09_IMFMonitor_Conditionality_Codebook.pdf)"
        href: "files/conditionality/v2017-09_IMFMonitor_Conditionality_Codebook.pdf"
        kind: "archive"
        format: "PDF"
        size: "2.0 MB"
        version: "September 2017"
      - label: "Main dataset (v2017-09_IMFMonitor_Conditionality_Main.zip)"
        href: "files/conditionality/v2017-09_IMFMonitor_Conditionality_Main.zip"
        kind: "archive"
        format: "Stata (.dta) in ZIP"
        size: "208 KB"
        version: "September 2017"
      - label: "Raw dataset (v2017-09_IMFMonitor_Conditionality_Raw.xlsx)"
        href: "files/conditionality/v2017-09_IMFMonitor_Conditionality_Raw.xlsx"
        kind: "archive"
        format: "Excel (.xlsx)"
        size: "4.1 MB"
        version: "September 2017"
    sources:
      - "Files: the public download on imfmonitor.org (the Wix file share, backed up 15 October 2026; byte-identical to the project's v2.1 and v1.0 folders, checked 20 October 2026). Sizes are the files' byte counts. The codebook is published as a PDF made from IMFMonitor_Conditionality_Codebook.docx (Thomas Stubbs, 20 October 2026), exported with Word on 20 October 2026 (32 pages, 600,691 bytes)."
      - "coverage: IMFMonitor_Conditionality_Main.dta (years 1980–2019; 220 country codes, 8,800 country-years) and IMFMonitor_Conditionality_Raw.xlsx (conditions for 134 country codes); codebook title 'IMF Conditionality Dataset, 1980-2019'."
      - "version: Thomas Stubbs, 20 October 2026 (versions are release dates). The current files, formerly labelled v2.1, were published on imfmonitor.org on 27 March 2026 (Wix file share, 'Mar 27, 2026'; file dates of the main dataset, code, and codebook). The raw and reviews files' notes sheets still read 'Version: June 2020'."
      - "unit: codebook, 'Variable List for the Raw Dataset' (country-year-condition) and 'Transforming the Data' (country-year indicators in the main dataset)."
      - "IMFMonitor_Reviews.xlsx, part of the same download on imfmonitor.org, is listed on the Other Data page, not here (Thomas Stubbs, 20 October 2026)."
      - "status: publicly downloadable from imfmonitor.org/download-data (checked 20 October 2026)."
      - "citation: codebook, 'Citation' section, worded and italicised as given there (Thomas Stubbs, 20 October 2026: use the codebook wording)."
      - "Headline count (for page text): BA1TOT in IMFMonitor_Conditionality_Main.dta sums to 65,894."
      - "Archive files: v1.0 codebook title page ('Version: September 2017', 'IMF Conditionality 1980–2014'). Published under the release-date prefix v2017-09_ (Thomas Stubbs, 20 October 2026); imfmonitor.org offered them as v1.0_IMFMonitor_Conditionality_*. Contents unchanged."

