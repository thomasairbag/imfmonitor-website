<a class="visually-hidden-focusable skip-link" href="#quarto-document-content">Skip to main content</a>
<script>
  // Quarto inserts this include inside <main>. Move the link to the start of
  // <body>, so it is the first thing a keyboard user reaches.
  (function () {
    var link = document.currentScript.previousElementSibling;
    document.body.insertBefore(link, document.body.firstChild);
  })();
</script>
