<script>
  // Copy button in citation boxes (the dataset-cite shortcode). The button
  // shows the result; the box's hidden status line tells screen readers.
  document.addEventListener("click", function (event) {
    var button = event.target.closest(".cite-copy");
    if (!button) return;
    var box = button.closest(".cite-box");
    var status = box.querySelector(".cite-status");
    function report(label, message) {
      button.textContent = label;
      if (status) status.textContent = message;
      setTimeout(function () {
        button.textContent = "Copy citation";
        if (status) status.textContent = "";
      }, 2000);
    }
    function failed() {
      report("Copy failed", "Copy failed: select the citation and copy it.");
    }
    if (!navigator.clipboard) { failed(); return; }
    navigator.clipboard.writeText(box.querySelector("p").innerText).then(function () {
      report("Copied", "Citation copied.");
    }, failed);
  });
</script>
