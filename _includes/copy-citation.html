<script>
  // Copy button in citation boxes (the dataset-cite shortcode).
  document.addEventListener("click", function (event) {
    var button = event.target.closest(".cite-copy");
    if (!button || !navigator.clipboard) return;
    var text = button.closest(".cite-box").querySelector("p").innerText;
    navigator.clipboard.writeText(text).then(function () {
      button.textContent = "Copied";
      setTimeout(function () { button.textContent = "Copy citation"; }, 2000);
    });
  });
</script>
