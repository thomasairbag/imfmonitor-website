project:
  type: website
  # GitHub Pages serves this folder.
  output-dir: docs
  # Render only .qmd pages, so CLAUDE.md and CHANGELOG.md are never published.
  render:
    - "**/*.qmd"
  resources:
    # Tells GitHub Pages to serve the files as they are, without Jekyll.
    - ".nojekyll"
    # Dataset downloads. The old /wp-content/ codebook path is not kept
    # (Thomas, 22 October 2026; plan decision 14).
    - "files/**"
    # Self-hosted fonts and their licences, referenced from styles/fonts.css.
    - "fonts/**"

# Dataset facts live in data/datasets.yml; the shortcodes in
# _extensions/imfmonitor/ read and display them.

website:
  title: "IMF Monitor"
  description: "Independent research data on the International Monetary Fund"
  # The staging address (plan decisions 4 and 46). The 404 page needs it for
  # links that work at any depth. Change to https://imfmonitor.org/ at cutover.
  site-url: "https://thomasairbag.github.io/imfmonitor-website/"
  # Bar mark wordmark and tab icon (plan decision 21). R/make-favicon.R draws
  # the icon.
  favicon: images/favicon.png
  navbar:
    logo: images/logo-mark.svg
    # Decorative: the title text beside it already says "IMF Monitor".
    logo-alt: ""
    # The six items fit on one line from 992px, with about 60px to spare
    # (measured 21 October 2026), so laptop screens show the full menu and
    # narrower ones get the menu button (Thomas, 21 October 2026).
    collapse-below: lg
    left:
      - text: Conditionality
        href: conditionality/index.qmd
      - text: Programs
        href: programs/index.qmd
      - text: Governance
        href: governance/index.qmd
      - text: Technical Assistance
        href: technical-assistance/index.qmd
      - text: Other Data
        href: other-data/index.qmd
      # Download Data is not in the menu: each dataset's page has its files,
      # and download-data/ only keeps the Wix address working (decision 45).
      - text: About
        href: about-us/index.qmd
  # One centred block: the reuse sentence, the site's only licence statement,
  # and contact; then a one-line independence note linking to the full
  # statement on About (Thomas, 22 October 2026), styled as smaller print in
  # custom.scss.
  page-footer:
    center: |
      You may reuse IMF Monitor data provided you cite it ([CC BY 4.0](https://creativecommons.org/licenses/by/4.0/)). Contact: [thomas.stubbs@rhul.ac.uk](mailto:thomas.stubbs@rhul.ac.uk)

      IMF Monitor is an [independent academic project](/about-us/index.qmd#independence), not affiliated with the International Monetary Fund.

format:
  html:
    lang: en-GB
    theme:
      - default
      - styles/custom.scss
    css: styles/fonts.css
    include-in-header:
      # Keeps the site out of search engines until cutover (plan Stage 8).
      # Remove only with Thomas's approval.
      - text: |
          <meta name="robots" content="noindex, nofollow">
    include-before-body:
      - _includes/skip-link.html
    include-after-body:
      - _includes/copy-citation.html

editor: visual
