project:
  type: website
  # GitHub Pages serves this folder.
  output-dir: docs
  # Render only .qmd pages, so CLAUDE.md and CHANGELOG.md are never published.
  render:
    - "**/*.qmd"
  resources:
    # Tells GitHub Pages to serve the files as they are, without Jekyll.
    - ".nojekyll"
    # Tells GitHub Pages the site's domain, imfmonitor.org (plan Stage 8).
    - "CNAME"
    # Dataset downloads. The old /wp-content/ codebook path is not kept
    # (Thomas, 22 October 2026; plan decision 14).
    - "files/**"
    # Self-hosted fonts and their licences, referenced from styles/fonts.css.
    # The leading slash keeps R/fonts (TTF files for drawing figures) out of
    # the site: an unanchored "fonts/**" matches any folder named fonts.
    - "/fonts/**"
    # Figures drawn by R/fig-*.R. The pages reference the phone versions only
    # in <picture> srcset attributes, which Quarto doesn't follow.
    - "images/figures/**"

# Dataset facts live in data/datasets.yml; the shortcodes in
# _extensions/imfmonitor/ read and display them.

website:
  title: "IMF Monitor"
  description: "Independent research data on the International Monetary Fund"
  # The live address since cutover (plan Stage 8, decision 66); the staging
  # address was https://thomasairbag.github.io/imfmonitor-website/. The 404
  # page needs it for links that work at any depth.
  site-url: "https://imfmonitor.org/"
  # Bar mark wordmark and tab icon (plan decision 21). R/make-favicon.R draws
  # the icon.
  favicon: images/favicon.png
  navbar:
    logo: images/logo-mark.svg
    # Quarto makes the logo a link of its own, separate from the title, so it
    # needs a name: an empty alt leaves screen readers an unnamed link
    # (WCAG 2.4.4; found at staging, Thomas approved 23 October 2026).
    logo-alt: "IMF Monitor"
    # The six items fit on one line from 992px, with about 60px to spare
    # (measured 21 October 2026), so laptop screens show the full menu and
    # narrower ones get the menu button (Thomas, 21 October 2026).
    collapse-below: lg
    left:
      - text: Conditionality
        href: conditionality/index.qmd
      - text: Programs
        href: programs/index.qmd
      - text: Governance
        href: governance/index.qmd
      - text: Technical Assistance
        href: technical-assistance/index.qmd
      - text: Other Data
        href: other-data/index.qmd
      # There is no Download Data page: each dataset's page has its files
      # (Thomas, 23 October 2026; plan decision 60).
      - text: About
        href: about/index.qmd
  # One centred paragraph: the reuse sentence, the site's only licence
  # statement, and contact, followed directly by the independence note linking
  # to the full statement on About (Thomas, 22–26 October 2026; plan decisions
  # 50, 63, and 64).
  page-footer:
    center: |
      You may reuse IMF Monitor data provided you cite it ([CC BY 4.0](https://creativecommons.org/licenses/by/4.0/)). Contact: [thomas.stubbs@rhul.ac.uk](mailto:thomas.stubbs@rhul.ac.uk). IMF Monitor is an [independent academic project](/about/index.qmd#independence), not affiliated with the International Monetary Fund.

format:
  html:
    lang: en-GB
    theme:
      - default
      - styles/custom.scss
    css: styles/fonts.css
    # Page titles read "Governance | IMF Monitor", as on the Wix site; Quarto
    # writes "Governance – IMF Monitor" (plan decision 62).
    template-partials:
      - _includes/metadata.html
    include-in-header:
      # The staging site's noindex tag came off at cutover, with Thomas's
      # approval (plan Stage 8).
      # Stops phones turning text such as "1995–2015; 142" into phone-number,
      # date, or address links (seen on an iPhone, 26 October 2026; plan
      # decision 64). The site's own links are unaffected.
      - text: |
          <meta name="format-detection" content="telephone=no, date=no, address=no, email=no">
    include-before-body:
      - _includes/skip-link.html
    include-after-body:
      - _includes/copy-citation.html

editor: visual
